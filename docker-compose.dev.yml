# Отличия машины разработчика. Накладывается поверх основного файла:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile full up -d
#
# Короче — `make up`.
#
# Здесь только одно: где висит интерфейс. Всё остальное у разработчика и на
# сервере совпадает, и разводить это по двум файлам значило бы однажды
# проверить одно, а поднять другое.

services:
  web:
    ports:
      - "8080:80"
