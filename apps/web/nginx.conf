# Раздача интерфейса и проход к API.
#
# Браузер обращается к одному адресу, а за ним два разных процесса. Так проще
# и надёжнее: кука сессии остаётся своей для домена, и CORS с ней не спорит —
# при разных адресах пришлось бы разрешать чужому источнику слать куки, а за
# этой кукой лежат себестоимость и маржа.

# Имя без «www» — основное, «www» уводится на него. Два живых адреса значат
# две куки сессии: человек входит на одном, открывает ссылку коллеги на
# другом и снова видит форму входа, не понимая почему.
server {
    listen 80;
    server_name www.bcorp.kz;
    return 301 http://bcorp.kz$request_uri;
}

# `default_server`, чтобы платформа отвечала и по адресу машины: пока имя не
# разошлось по DNS и при заходе из офисной сети по IP человек должен видеть
# вход, а не чужой сайт и не пустую страницу.
server {
    listen 80 default_server;
    server_name bcorp.kz;

    # Сто мегабайт — это предел канала, а не правило: на один файл платформа
    # пускает шестьдесят четыре (PLATFORM__STORAGE__MAX_UPLOAD_MB), и всё, что
    # между ними, отвергает уже она — человеческими словами и с указанием
    # предела. Тендерная папка приходит целиком, сканы МЗ и ТЗ бывают по
    # десять мегабайт штука.
    client_max_body_size 100M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Прогресс задачи идёт потоком событий. Буферизация копит ответ до
        # конца запроса — а конец здесь наступает через час, когда разбор
        # закончился: полоса выполнения так и осталась бы на нуле.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # Разбор папки и поиск на рынках идут минутами. Стандартная минута
        # оборвала бы запрос ровно посередине оплаченной работы.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Проверка владения доменом для сертификата. Лежит здесь заранее, чтобы
    # включение HTTPS не требовало правки этого файла и перезапуска: сейчас
    # платформа отвечает по HTTP, и пароль с кукой сессии идут открытым
    # текстом — за этой кукой себестоимость и маржа.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        root /usr/share/nginx/html;
        # Приложение одностраничное: адреса вроде `/skstore/bargains` живут в
        # браузере, и на диске таких файлов нет. Без этой строки обновление
        # страницы на любом разделе даёт 404.
        try_files $uri $uri/ /index.html;
    }

    # Хэш в имени файла меняется вместе с содержимым, поэтому старое можно
    # держать сколько угодно. `index.html` — наоборот: он и решает, какие
    # файлы просить, и закэшированный оставил бы человека на прошлой сборке.
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
}
